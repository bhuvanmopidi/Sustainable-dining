spring:
  application:
    name: sustainable-dining-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dining}
    username: ${DB_USER:dining}
    password: ${DB_PASSWORD:dining}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

dining:
  config-path: ${DINING_CONFIG_PATH:../config/experiment_config.v1.json}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8001}
  sim-service-url: ${SIM_SERVICE_URL:http://localhost:8002}

management:
  endpoints:
    web:
      exposure:
        include: health,info